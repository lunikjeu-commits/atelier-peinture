name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          mkdir /tmp/app && cd /tmp/app
          flutter create --platforms=android --org com.atelier atelier_peinture
          cd atelier_peinture
          cp $GITHUB_WORKSPACE/main.dart lib/main.dart
          flutter pub add shared_preferences image_picker path_provider
          flutter pub add flutter_localizations --sdk=flutter
          sed -i 's/android:label="[^"]*"/android:label="Atelier Peinture"/' android/app/src/main/AndroidManifest.xml
          F=android/app/build.gradle.kts; [ -f "$F" ] || F=android/app/build.gradle
          sed -i 's/^android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$F"
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-peinture-apk
          path: /tmp/app/atelier_peinture/build/app/outputs/flutter-apk/app-release.apk
